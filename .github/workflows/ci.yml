# P4-87: 回归门禁 —— 宿主测试套件 + 金样比对 (Linux runner)
# net_smoke (QEMU 网络冒烟) 依赖 Windows PowerShell + 桌面 QEMU,
# 保留为手动门禁 (见 tests/net_smoke.ps1, 已参数化 -Root/-Qemu)。
# kmod_smoke (QEMU kmod/组件化串口冒烟) 同为手动门禁,
# 见 res/scripts/test/kmod_smoke.ps1 (-Root/-Qemu/-WaitSeconds/-MinBuiltins)。
name: SkylineSystem CI

on:
  push:
  pull_request:

jobs:
  host-suites:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ gcc make clang

      - name: Build host test suites
        working-directory: tests
        run: make -B slub slub-poison fc fc-reg sched slub-mt fc-mt

      - name: kprintf fuzz (ASAN+UBSAN, 债务 #6)
        working-directory: tests
        run: make -B fuzz && ./bin/kprintf_fuzz

      - name: allocator chaos (P4-86)
        working-directory: tests
        run: make -B alloc && ./bin/alloc_test

      - name: userspace libc host suite (task-11: setjmp/string/math/locale/time/stdio)
        working-directory: tests
        run: make -B stdc && ./bin/stdc_test

      - name: kmod host gate (build + run, topology/capability/ELF loader)
        working-directory: tests
        run: make -B kmod && ./bin/kmod_test

      - name: kmod ASAN gate (ELF loader negative cases + fuzz)
        working-directory: tests
        run: make -B kmod-asan && ./bin/kmod_test_asan

      - name: Static analysis gate (round 98-99)
        working-directory: tests
        run: bash ../res/scripts/test/analyze.sh && ! grep -q "warning:" /tmp/static_analysis.txt

      - name: Run suites (ci.sh)
        working-directory: tests
        run: bash ../res/scripts/test/ci.sh

      - name: Golden diff gate
        working-directory: tests
        run: bash ../res/scripts/test/golden.sh

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: tests/ci_*.log

  kernel-build:
    # The host suites above never compile the kernel: a kernel/userspace break
    # could pass CI. This job does a full clean build and boots the result.
    #
    # Order matters: the top-level `kernel` target builds component .ko first,
    # then the kernel Makefile runs nm over those .ko files and generates the
    # kernel.component.v1 .kout table at link time, then links Tier 0 and packs
    # modules.saf. Building with `make -C kernel` alone skips the component
    # build: the kernel links, but the export table is empty and modules fail
    # to resolve at boot.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld nasm make python3 gcc g++ \
            xorriso e2fsprogs e2tools mtools dos2unix curl wget unzip \
            qemu-system-x86

      - name: Build components, kernel, modules and modules.saf
        run: make kernel -j2

      - name: Build userspace library
        run: make -C lib -j2

      - name: Create program image
        run: |
          truncate -s 256M disk.img
          mkfs.ext4 -q -F -O ^metadata_csum disk.img

      - name: Build programs
        run: make -C programs -j2

      - name: Build ISO
        run: make SkylineSystem-x86_64.iso -j2

      - name: Module format / relocation gate
        run: make -C kernel SS_BUILD_DIR="$PWD" modules-check

      - name: QEMU boot smoke
        run: sh res/scripts/test/qemu_smoke.sh --wait 180 --disk disk.img

