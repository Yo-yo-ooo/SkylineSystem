# P4-87: 回归门禁 —— 宿主测试套件 + 金样比对 (Linux runner)
# net_smoke (QEMU 网络冒烟) 依赖 Windows PowerShell + 桌面 QEMU,
# 保留为手动门禁 (见 tests/net_smoke.ps1, 已参数化 -Root/-Qemu)。
name: SkylineSystem CI

on:
  push:
  pull_request:

jobs:
  host-suites:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ gcc make clang

      - name: Build host test suites
        working-directory: tests
        run: make -B slub slub-poison fc fc-reg sched slub-mt fc-mt

      - name: kprintf fuzz (ASAN+UBSAN, 债务 #6)
        working-directory: tests
        run: make -B fuzz && ./bin/kprintf_fuzz

      - name: allocator chaos (P4-86)
        working-directory: tests
        run: make -B alloc && ./bin/alloc_test

      - name: Static analysis gate (round 98-99)
        working-directory: tests
        run: bash ../res/scripts/test/analyze.sh && ! grep -q "warning:" /tmp/static_analysis.txt

      - name: Run suites (ci.sh)
        working-directory: tests
        run: bash ../res/scripts/test/ci.sh

      - name: Golden diff gate
        working-directory: tests
        run: bash ../res/scripts/test/golden.sh

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: tests/ci_*.log
